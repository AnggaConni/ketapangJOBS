name: Auto Update Ketapang Vacancies

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Tambahkan beautifulsoup4 untuk scraping HTML
      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Hybrid Scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper.py

      - name: Commit & Push Update JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vacancy.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto-update: refresh lowongan Ketapang (Hybrid)"
          git push
