name: Auto Update Ketapang Vacancies

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Ini adalah tombol "Force Run" (Run workflow) di GitHub Actions UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # INI SOLUSI ERROR 403: Memberikan izin bot untuk Push (Write)
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper (JSearch API)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scraper.py

      - name: Commit & Push Update JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vacancy.json
          # Commit hanya jika ada perubahan data
          git diff --quiet && git diff --staged --quiet || git commit -m "auto-update: refresh lowongan Ketapang via JSearch"
          git push
