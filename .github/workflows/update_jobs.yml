name: Auto Update Ketapang Vacancies

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Ini memunculkan tombol "Run workflow" (Force Run) di GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # INI SOLUSI ERROR 403: Mengizinkan GitHub Actions bot untuk push/write ke repo
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper (Free Internal API)
        run: python scraper.py

      - name: Commit & Push Update JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vacancy.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto-update: refresh lowongan Ketapang via Web Scraper"
          git push
